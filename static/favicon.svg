<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="gradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="gradBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="48" height="48" rx="12" fill="#080c16" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />

  <!-- Bottom Plate (Custodians / Issuers) -->
  <path d="M24 38L10 30L24 22L38 30Z" fill="url(#gradBot)" opacity="0.85" />
  <path d="M10 30L24 38V41L10 33Z" fill="#581c87" opacity="0.7" />
  <path d="M38 30L24 38V41L38 33Z" fill="#3b0764" opacity="0.9" />

  <!-- Middle Plate (SEC Verified Underlying Asset) -->
  <path d="M24 28L11 20.5L24 13L37 20.5Z" fill="url(#gradMid)" opacity="0.8" />
  <path d="M11 20.5L24 28V30L11 22.5Z" fill="#1e3a8a" opacity="0.6" />
  <path d="M37 20.5L24 28V30L37 22.5Z" fill="#172554" opacity="0.8" />

  <!-- Top Plate (Token Wrapper / Surface) -->
  <path d="M24 18L12 11L24 4L36 11Z" fill="url(#gradTop)" filter="url(#glow)" />
  <path d="M12 11L24 18V20L12 13Z" fill="#0369a1" opacity="0.7" />
  <path d="M36 11L24 18V20L36 13Z" fill="#0c4a6e" opacity="0.9" />

  <!-- Look-Through Vertical X-Ray Penetration Beam -->
  <ellipse cx="24" cy="11" rx="3.5" ry="2" fill="#ffffff" />
  <line x1="24" y1="9" x2="24" y2="35" stroke="url(#beam)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
  <ellipse cx="24" cy="20.5" rx="2.5" ry="1.4" fill="#ffffff" opacity="0.9" />
  <ellipse cx="24" cy="30" rx="3" ry="1.6" fill="#00f2fe" />
</svg>
