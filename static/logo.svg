<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="lTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="lBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="lBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container (38x38) -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="#080c16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    <!-- Bottom Plate -->
    <path d="M20 32L8 25L20 18L32 25Z" fill="url(#lBot)" opacity="0.85" />
    <path d="M8 25L20 32V34.5L8 27.5Z" fill="#581c87" opacity="0.8" />
    <path d="M32 25L20 32V34.5L32 27.5Z" fill="#3b0764" opacity="0.9" />

    <!-- Middle Plate -->
    <path d="M20 23.5L9 17L20 10.5L31 17Z" fill="url(#lMid)" opacity="0.8" />
    <path d="M9 17L20 23.5V25.2L9 18.7Z" fill="#1e3a8a" opacity="0.7" />
    <path d="M31 17L20 23.5V25.2L31 18.7Z" fill="#172554" opacity="0.9" />

    <!-- Top Plate -->
    <path d="M20 15L10 9L20 3L30 9Z" fill="url(#lTop)" filter="url(#lGlow)" />
    <path d="M10 9L20 15V16.8L10 10.8Z" fill="#0369a1" opacity="0.8" />
    <path d="M30 9L20 15V16.8L30 10.8Z" fill="#0c4a6e" opacity="0.95" />

    <!-- Beam -->
    <line x1="20" y1="7" x2="20" y2="29" stroke="url(#lBeam)" stroke-width="2" stroke-linecap="round" filter="url(#lGlow)" />
    <circle cx="20" cy="9" r="1.8" fill="#ffffff" />
    <circle cx="20" cy="17" r="1.4" fill="#ffffff" opacity="0.9" />
    <circle cx="20" cy="25" r="1.6" fill="#00f2fe" />
  </g>

  <!-- Typography: Underlying -->
  <text x="56" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5px">Underlying</text>

  <!-- Sub-Badge: RWA INTELLIGENCE -->
  <rect x="56" y="28" width="94" height="14" rx="3" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="0.8" />
  <text x="60" y="38" fill="#00f2fe" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" font-weight="700" letter-spacing="0.8px">RWA INTELLIGENCE</text>
</svg>
